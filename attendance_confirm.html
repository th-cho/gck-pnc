<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Common CSS -->
  <link href="common.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { padding: 20px; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="card mb-4 p-4 border-0 shadow-sm">
    <div class="row g-3 align-items-end">
      <div class="col-md-3"><label class="form-label small fw-bold text-muted">대상월</label><input type="month" class="form-control form-control-sm" value="2026-02"></div>
      <div class="col-md-9 d-flex justify-content-end gap-2"><button class="btn btn-sm btn-gongcha px-4">제출 현황 조회</button></div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center">
          <h6 class="mb-0 fw-bold">매장별 근태 제출 및 확정 현황 (P&C 본사 전용)</h6>
          <button class="btn btn-sm btn-success px-3 shadow-sm"><i data-lucide="check-check" style="width:14px;"></i> 일괄 승인</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 text-center">
            <thead>
            <tr>
              <th>매장명</th>
              <th>인원(정/파)</th>
              <th>제출일시</th>
              <th>정합성 여부</th>
              <th>주 52h 위반</th>
              <th>상태</th>
              <th>작업</th>
            </tr>
            </thead>
            <tbody>
            <tr>
              <td class="fw-bold">광복점</td>
              <td>5 / 12</td>
              <td>2026-02-18 14:20</td>
              <td><span class="text-success fw-bold">일치</span></td>
              <td><span class="text-muted">-</span></td>
              <td><span class="badge bg-warning shadow-sm">검토중</span></td>
              <td><button class="btn btn-xs btn-gongcha py-1" style="font-size:10px;">상세조회/확정</button></td>
            </tr>
            <tr>
              <td class="fw-bold">강남본점</td>
              <td>8 / 20</td>
              <td>2026-02-19 10:05</td>
              <td><span class="text-danger fw-bold">불일치(-8h)</span></td>
              <td><span class="text-danger fw-bold">1건</span></td>
              <td><span class="badge bg-secondary shadow-sm">대기</span></td>
              <td><button class="btn btn-xs btn-light border py-1" style="font-size:10px;">반려</button></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
