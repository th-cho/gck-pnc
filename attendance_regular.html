<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공차 근태관리 - 정규직</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Common CSS -->
  <link href="common.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- AG Grid -->
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <style>
    body {
      padding: 20px;
    }

    .card {
      margin-bottom: 1.5rem;
    }

    .alert-limit {
      background: #fff4f4;
      border-left: 4px solid var(--gongcha-red);
      border-radius: 8px;
      font-size: 13px;
    }

    .policy-guide {
      font-size: 12px;
      color: #6c757d;
      background: white;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #ced4da;
    }

    /* AG Grid 커스텀 스타일 */
    .ag-theme-alpine {
      --ag-header-height: 40px;
      --ag-row-height: 40px;
      --ag-font-size: 12px;
      --ag-header-background-color: #f8f9fa;
      --ag-odd-row-background-color: #ffffff;
      --ag-border-color: #dee2e6;
    }

    .ag-header-cell-label {
      justify-content: center;
    }

    .ag-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 주말 색상 */
    .sat-col { color: #0d6efd; font-weight: bold; }
    .sun-col { color: #dc3545; font-weight: bold; }

    /* 합계 컬럼 강조 */
    .total-col { background-color: #fdf5f7 !important; font-weight: bold; color: var(--gongcha-red); }
  </style>
</head>
<body>
<div class="container-fluid">

  <!-- 1. 주 52시간 실시간 모니터링 알림 -->
  <div class="alert alert-limit p-3 mb-4 d-flex align-items-center justify-content-between shadow-sm">
    <div>
      <i data-lucide="alert-triangle" class="text-danger me-2" style="width:18px; vertical-align: middle;"></i>
      <strong>주 52시간 관리 모니터링</strong>: 현재 선택된 직원의 주 누적 근로시간은 <span class="text-danger fw-bold">48.5시간</span> 입니다. (잔여 연장 가능: 3.5h)
    </div>
    <span class="badge bg-danger">임신기 단축근무 적용</span>
  </div>

  <!-- 2. 상단 조회 필터 -->
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label small fw-bold text-muted text-uppercase">대상월</label>
          <input type="month" class="form-control form-control-sm border-secondary-subtle" value="2026-02">
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted text-uppercase">매장명</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option>광복점</option>
            <option>강남본점</option>
          </select>
        </div>
        <div class="col-md-7 d-flex justify-content-end gap-2">
          <button class="btn btn-sm btn-light border px-4"><i data-lucide="rotate-ccw" class="me-1" style="width:14px;"></i>초기화</button>
          <button class="btn btn-sm btn-gongcha px-4 shadow-sm"><i data-lucide="search" class="me-1" style="width:14px;"></i>조회</button>
          <button class="btn btn-sm btn-gongcha px-4 shadow-sm"><i data-lucide="save" class="me-1" style="width:14px;"></i>일괄저장</button>
          <button class="btn btn-sm btn-outline-danger px-3 shadow-sm">근태제출</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 근태 매트릭스 그리드 (AG Grid) -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white p-3 border-bottom-0">
      <div class="d-flex align-items-center gap-2">
        <i data-lucide="calendar-check" class="text-danger" style="color:var(--gongcha-red) !important;"></i>
        <h6 class="mb-0 fw-bold">정규직 일별 근태 입력 현황</h6>
      </div>
    </div>
    <div id="myGrid" class="ag-theme-alpine" style="height: 400px; width: 100%;"></div>
  </div>

  <!-- 4. 정책 기반 정합성 가이드 -->
  <div class="policy-guide shadow-sm mt-3">
    <div class="d-flex align-items-center gap-2 mb-2">
      <i data-lucide="info" style="width:16px;"></i>
      <span class="fw-bold">월 근태 정합성 검증 안내</span>
    </div>
    <p class="mb-1">매장 정규직은 월 단위 정해진 휴일 수를 준수해야 하며, 아래 공식을 통해 정합성을 검증합니다.</p>
    <code class="d-block p-2 bg-light rounded text-dark mt-2 border">
      월 근무 기준시간 = 정근 - 휴근 - 연장 + 조퇴 + 지각 + ((연차 + 반차 + 반반차 + 결근일수) × 8h)
    </code>
    <p class="mt-2 mb-0 small text-muted">* 일 실제 근로 12시간 초과 또는 주 52시간 초과 시 시스템에서 저장이 차단될 수 있습니다.</p>
  </div>
</div>

<script>
  $(document).ready(function() {
    lucide.createIcons();

    // AG Grid 설정
    const columnDefs = [
      { field: "name", headerName: "성명", width: 80, pinned: 'left', cellStyle: { 'font-weight': 'bold' } },
      { field: "position", headerName: "직급", width: 80, pinned: 'left' },
      { field: "type", headerName: "항목", width: 80, pinned: 'left', cellStyle: { 'background-color': '#f8f9fa' } },
      // 날짜 컬럼 생성 (2월 1일 ~ 2월 28일 예시)
      ...Array.from({ length: 28 }, (_, i) => {
        const day = i + 1;
        const date = new Date(2026, 1, day); // 2026년 2월
        const dayOfWeek = date.getDay(); // 0:일, 6:토
        let headerClass = '';

        if (dayOfWeek === 0) headerClass = 'sun-col';
        else if (dayOfWeek === 6) headerClass = 'sat-col';

        return {
          field: `d${day}`,
          headerName: `${day}일`,
          width: 60,
          editable: true,
          headerClass: headerClass,
          cellStyle: params => {
             if (dayOfWeek === 0) return { color: '#dc3545' };
             if (dayOfWeek === 6) return { color: '#0d6efd' };
             return null;
          }
        };
      }),
      { field: "total", headerName: "합계", width: 80, pinned: 'right', cellClass: 'total-col' }
    ];

    const rowData = [
      { name: "박지홍", position: "점포관리자", type: "출근", d1: "09:00", d2: "09:00", d3: "09:00", d4: "09:00", d5: "09:00", d6: "09:00", total: "-" },
      { name: "박지홍", position: "점포관리자", type: "퇴근", d1: "22:30", d2: "18:00", d3: "18:00", d4: "18:00", d5: "18:00", d6: "18:00", total: "-" },
      { name: "박지홍", position: "점포관리자", type: "휴게", d1: "1.0", d2: "1.0", d3: "1.0", d4: "1.0", d5: "1.0", d6: "1.0", total: "25.0" },
      { name: "박지홍", position: "점포관리자", type: "연장", d1: "4.5", d2: "0.0", d3: "0.0", d4: "0.0", d5: "0.0", d6: "0.0", total: "12.5" },
      { name: "박지홍", position: "점포관리자", type: "심야", d1: "0.5", d2: "0.0", d3: "0.0", d4: "0.0", d5: "0.0", d6: "0.0", total: "2.0" },

      // 추가 데이터 예시
      { name: "김철수", position: "매니저", type: "출근", d1: "09:00", d2: "09:00", d3: "09:00", d4: "09:00", d5: "09:00", d6: "09:00", total: "-" },
      { name: "김철수", position: "매니저", type: "퇴근", d1: "18:00", d2: "18:00", d3: "18:00", d4: "18:00", d5: "18:00", d6: "18:00", total: "-" },
    ];

    const gridOptions = {
      columnDefs: columnDefs,
      rowData: rowData,
      defaultColDef: {
        resizable: true,
        sortable: false,
        filter: false
      },
      getRowStyle: params => {
        if (params.data.type === '연장' || params.data.type === '심야') {
          return { background: '#fdf5f7', fontWeight: 'bold', color: '#8B0029' };
        }
      }
    };

    const gridDiv = document.querySelector('#myGrid');
    // AG Grid v30+ 변경된 초기화 방식 적용
    agGrid.createGrid(gridDiv, gridOptions);
  });
</script>
</body>
</html>
