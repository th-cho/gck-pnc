<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공차 근태관리 - 메뉴관리</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

    :root {
      --gongcha-red: #8B0029;
      --gongcha-dark: #6e0021;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8f9fa;
      padding: 20px;
    }

    .btn-gongcha {
      background-color: var(--gongcha-red);
      color: white;
      border: none;
    }
    .btn-gongcha:hover {
      background-color: var(--gongcha-dark);
      color: white;
    }

    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04);
    }

    .table thead th {
      background-color: #f8f9fa;
      font-size: 11px;
      text-transform: uppercase;
      color: #6c757d;
      border-top: none;
      padding: 12px 10px;
    }

    .text-gongcha { color: var(--gongcha-red); }

    .menu-level-1 { font-weight: 700; color: #333; }
    .menu-level-2 { padding-left: 20px; color: #666; }

    .badge-menu-group {
      background-color: #f1f3f5;
      color: #495057;
      font-weight: 600;
      font-size: 10px;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <!-- 검색 필터 영역 -->
  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted uppercase">메뉴 그룹</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option value="">전체</option>
            <option value="SY">시스템 관리</option>
            <option value="BS">기초 관리</option>
            <option value="AT">근태 관리</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">메뉴 명</label>
          <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="찾으실 메뉴 이름을 입력하세요.">
        </div>
        <div class="col-md-3 d-flex gap-2 justify-content-end">
          <button class="btn btn-sm btn-light border px-3"><i data-lucide="rotate-ccw" style="width:14px; margin-right:4px;"></i>초기화</button>
          <button class="btn btn-sm btn-gongcha px-4"><i data-lucide="search" style="width:14px; margin-right:4px;"></i>조회</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 메뉴 목록 영역 -->
  <div class="card">
    <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
      <div class="d-flex align-items-center gap-2">
        <i data-lucide="menu" class="text-danger" style="color:var(--gongcha-red) !important; width:18px;"></i>
        <h6 class="mb-0 fw-bold">시스템 메뉴 계층 구조</h6>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary px-3"><i data-lucide="plus-circle" style="width:14px; margin-right:4px;"></i>대메뉴 추가</button>
        <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" style="width:14px; margin-right:4px;"></i>변경사항 저장</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0" id="menuTable">
        <thead>
        <tr>
          <th class="text-center" style="width: 50px;">순서</th>
          <th style="width: 120px;">그룹</th>
          <th style="width: 100px;" class="text-center">레벨</th>
          <th>메뉴 명</th>
          <th>연결 프로그램 ID</th>
          <th style="width: 100px;" class="text-center">정렬순서</th>
          <th style="width: 100px;" class="text-center">사용여부</th>
          <th style="width: 80px;" class="text-center">관리</th>
        </tr>
        </thead>
        <tbody>
        <!-- 시스템 관리 그룹 -->
        <tr class="table-light">
          <td class="text-center small text-muted">1</td>
          <td><span class="badge badge-menu-group">시스템 관리</span></td>
          <td class="text-center"><span class="badge bg-dark">1단계</span></td>
          <td class="menu-level-1">시스템 관리</td>
          <td class="text-muted">-</td>
          <td class="text-center">10</td>
          <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
          <td class="text-center"><i data-lucide="plus" style="width:14px; cursor:pointer;" title="하위메뉴 추가"></i></td>
        </tr>
        <tr>
          <td class="text-center small text-muted">2</td>
          <td><span class="badge badge-menu-group">시스템 관리</span></td>
          <td class="text-center"><span class="badge bg-secondary">2단계</span></td>
          <td class="menu-level-2"><i data-lucide="corner-down-right" style="width:12px;" class="me-1"></i> 회사정보관리</td>
          <td class="small text-gongcha fw-bold">SY10010</td>
          <td class="text-center">1010</td>
          <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
          <td class="text-center"><i data-lucide="trash-2" class="text-muted" style="width:14px; cursor:pointer;"></i></td>
        </tr>
        <tr>
          <td class="text-center small text-muted">3</td>
          <td><span class="badge badge-menu-group">시스템 관리</span></td>
          <td class="text-center"><span class="badge bg-secondary">2단계</span></td>
          <td class="menu-level-2"><i data-lucide="corner-down-right" style="width:12px;" class="me-1"></i> 프로그램정보</td>
          <td class="small text-gongcha fw-bold">SY10020</td>
          <td class="text-center">1020</td>
          <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
          <td class="text-center"><i data-lucide="trash-2" class="text-muted" style="width:14px; cursor:pointer;"></i></td>
        </tr>

        <!-- 근태 관리 그룹 -->
        <tr class="table-light">
          <td class="text-center small text-muted">4</td>
          <td><span class="badge badge-menu-group">근태 관리</span></td>
          <td class="text-center"><span class="badge bg-dark">1단계</span></td>
          <td class="menu-level-1">근태 관리</td>
          <td class="text-muted">-</td>
          <td class="text-center">30</td>
          <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
          <td class="text-center"><i data-lucide="plus" style="width:14px; cursor:pointer;"></i></td>
        </tr>
        <tr>
          <td class="text-center small text-muted">5</td>
          <td><span class="badge badge-menu-group">근태 관리</span></td>
          <td class="text-center"><span class="badge bg-secondary">2단계</span></td>
          <td class="menu-level-2"><i data-lucide="corner-down-right" style="width:12px;" class="me-1"></i> 정규직 근태관리</td>
          <td class="small text-gongcha fw-bold">AT10020</td>
          <td class="text-center">3010</td>
          <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
          <td class="text-center"><i data-lucide="trash-2" class="text-muted" style="width:14px; cursor:pointer;"></i></td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-white border-top-0 p-3 text-center">
      <p class="mb-0 text-muted small">메뉴의 순서와 프로그램 연결 정보를 실시간으로 관리합니다.</p>
    </div>
  </div>
</div>

<script>
  $(document).ready(function() {
    // Lucide 아이콘 초기화
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    // 행 선택 인터렉션
    $('#menuTable tbody tr').on('click', function() {
      $('#menuTable tbody tr').removeClass('table-active');
      $(this).addClass('table-active');
    });
  });
</script>
</body>
</html>
