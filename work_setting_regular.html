<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공차 근태관리 - 근무설정(정규근무자)</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Common CSS -->
  <link href="common.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- AG Grid -->
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <style>
    body {
      padding: 20px;
    }

    .card {
      margin-bottom: 1.5rem;
    }

    /* AG Grid 커스텀 스타일 */
    .ag-theme-alpine {
      --ag-header-height: 40px;
      --ag-row-height: 40px;
      --ag-font-size: 12px;
      --ag-header-background-color: #f8f9fa;
      --ag-odd-row-background-color: #ffffff;
      --ag-border-color: #dee2e6;
    }

    .ag-header-cell-label {
      justify-content: center;
    }

    .ag-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <!-- 상단 필터 영역 -->
  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">매장명</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option value="">전체</option>
            <option value="광복점">광복점</option>
            <option value="강남본점">강남본점</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">사번 / 성명</label>
          <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="검색어를 입력하세요.">
        </div>
        <div class="col-md-3 d-flex gap-2 justify-content-end">
          <button class="btn btn-sm btn-light border px-3"><i data-lucide="rotate-ccw" style="width:14px; margin-right:4px;"></i>초기화</button>
          <button class="btn btn-sm btn-gongcha px-4"><i data-lucide="search" style="width:14px; margin-right:4px;"></i>조회</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 데이터 그리드 영역 -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
      <div class="d-flex align-items-center gap-2">
        <i data-lucide="calendar-days" class="text-danger" style="color:var(--gongcha-red) !important; width:18px;"></i>
        <h6 class="mb-0 fw-bold">정규근무자 기본 근무 스케줄 설정</h6>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary px-3"><i data-lucide="download" style="width:14px; margin-right:4px;"></i>엑셀</button>
        <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" style="width:14px; margin-right:4px;"></i>전체 저장</button>
      </div>
    </div>
    <div id="myGrid" class="ag-theme-alpine" style="height: 400px; width: 100%;"></div>
    <div class="card-footer bg-white border-top-0 p-3">
      <p class="mb-0 text-muted small text-center"><i data-lucide="info" style="width:12px; margin-right:4px;"></i>정규직의 경우 기본 근로시간(8시간)과 주휴일 정보를 관리합니다.</p>
    </div>
  </div>
</div>

<script>
  $(document).ready(function() {
    lucide.createIcons();

    const columnDefs = [
      { field: "no", headerName: "NO", width: 60, pinned: 'left' },
      { field: "store", headerName: "매장", width: 100 },
      { field: "id", headerName: "사번", width: 100, cellStyle: { 'font-weight': 'bold', 'color': '#8B0029' } },
      { field: "name", headerName: "성명", width: 100 },
      { field: "position", headerName: "직급", width: 100 },
      { field: "startTime", headerName: "출근시간", width: 100, editable: true },
      { field: "endTime", headerName: "퇴근시간", width: 100, editable: true },
      { field: "breakTime", headerName: "휴게(h)", width: 80, editable: true },
      { field: "workTime", headerName: "근무(h)", width: 80, cellStyle: { 'font-weight': 'bold' } },
      { field: "holiday", headerName: "주휴일", width: 100, editable: true, cellEditor: 'agSelectCellEditor', cellEditorParams: { values: ['월', '화', '수', '목', '금', '토', '일'] } },
      { field: "holidayTime", headerName: "주휴시간", width: 100, editable: true },
      { field: "note", headerName: "비고", minWidth: 150, flex: 1, editable: true }
    ];

    const rowData = [
      { no: 1, store: "광복점", id: "S19080901", name: "박지홍", position: "점포관리자", startTime: "09:00", endTime: "18:00", breakTime: "1.0", workTime: "8.0", holiday: "일", holidayTime: "8.0", note: "" },
      { no: 2, store: "강남본점", id: "S23112702", name: "김예지", position: "캡틴", startTime: "13:00", endTime: "22:00", breakTime: "1.0", workTime: "8.0", holiday: "일", holidayTime: "8.0", note: "" }
    ];

    const gridOptions = {
      columnDefs: columnDefs,
      rowData: rowData,
      defaultColDef: {
        resizable: true,
        sortable: true,
        filter: true
      }
    };

    const gridDiv = document.querySelector('#myGrid');
    agGrid.createGrid(gridDiv, gridOptions);
  });
</script>
</body>
</html>
