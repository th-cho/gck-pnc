<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공차 근태관리 - 근무설정(정규근무자)</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Common CSS -->
  <link href="common.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      padding: 20px;
    }

    .card {
      margin-bottom: 1.5rem;
    }

    .table thead th {
      white-space: nowrap;
    }

    .form-control-sm {
      font-size: 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <!-- 상단 필터 영역 -->
  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">매장명</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option value="">전체</option>
            <option value="광복점">광복점</option>
            <option value="강남본점">강남본점</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-bold text-muted">사번 / 성명</label>
          <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="검색어를 입력하세요.">
        </div>
        <div class="col-md-3 d-flex gap-2 justify-content-end">
          <button class="btn btn-sm btn-light border px-3"><i data-lucide="rotate-ccw" style="width:14px; margin-right:4px;"></i>초기화</button>
          <button class="btn btn-sm btn-gongcha px-4"><i data-lucide="search" style="width:14px; margin-right:4px;"></i>조회</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 데이터 그리드 영역 -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
      <div class="d-flex align-items-center gap-2">
        <i data-lucide="calendar-days" class="text-danger" style="color:var(--gongcha-red) !important; width:18px;"></i>
        <h6 class="mb-0 fw-bold">정규근무자 기본 근무 스케줄 설정</h6>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary px-3"><i data-lucide="download" style="width:14px; margin-right:4px;"></i>엑셀</button>
        <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" style="width:14px; margin-right:4px;"></i>전체 저장</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 text-center">
        <thead>
        <tr>
          <th style="width: 50px;">NO</th>
          <th>매장</th>
          <th>사번</th>
          <th>성명</th>
          <th>직급</th>
          <th style="width: 100px;">출근시간</th>
          <th style="width: 100px;">퇴근시간</th>
          <th style="width: 80px;">휴게(h)</th>
          <th style="width: 80px;">근무(h)</th>
          <th style="width: 100px;">주휴일</th>
          <th style="width: 100px;">주휴시간</th>
          <th style="min-width: 150px;">비고</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td class="text-muted small">1</td>
          <td>광복점</td>
          <td class="fw-bold text-gongcha">$19080901</td>
          <td>박지홍</td>
          <td>점포관리자</td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="09:00" style="width: 70px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="18:00" style="width: 70px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="1.0" style="width: 50px;"></td>
          <td class="fw-bold">8.0</td>
          <td>
            <select class="form-select form-select-sm mx-auto" style="width: 80px;">
              <option>월</option><option>화</option><option>수</option><option>목</option><option>금</option><option>토</option><option selected>일</option>
            </select>
          </td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="8.0" style="width: 60px;"></td>
          <td><input type="text" class="form-control form-control-sm border-0 bg-transparent" placeholder="특이사항 입력"></td>
        </tr>
        <tr>
          <td class="text-muted small">2</td>
          <td>강남본점</td>
          <td class="fw-bold text-gongcha">S23112702</td>
          <td>김예지</td>
          <td>캡틴</td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="13:00" style="width: 70px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="22:00" style="width: 70px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="1.0" style="width: 50px;"></td>
          <td class="fw-bold">8.0</td>
          <td>
            <select class="form-select form-select-sm mx-auto" style="width: 80px;">
              <option selected>일</option>
            </select>
          </td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="8.0" style="width: 60px;"></td>
          <td><input type="text" class="form-control form-control-sm border-0 bg-transparent" placeholder="입력"></td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-white border-top-0 p-3">
      <p class="mb-0 text-muted small text-center"><i data-lucide="info" style="width:12px; margin-right:4px;"></i>정규직의 경우 기본 근로시간(8시간)과 주휴일 정보를 관리합니다.</p>
    </div>
  </div>
</div>

<script>
  $(document).ready(function() {
    if (typeof lucide !== 'undefined') lucide.createIcons();
  });
</script>
</body>
</html>
