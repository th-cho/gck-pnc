<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 정보 관리 - 공차 직영매장 근태관리 시스템</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Common CSS -->
    <link href="common.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- AG Grid -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <style>
        body { padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04); }

        /* AG Grid 커스텀 스타일 */
        .ag-theme-alpine {
            --ag-header-height: 40px;
            --ag-row-height: 40px;
            --ag-font-size: 12px;
            --ag-header-background-color: #f8f9fa;
            --ag-odd-row-background-color: #ffffff;
            --ag-border-color: #dee2e6;
        }
        .ag-header-cell-label { justify-content: center; }
        .ag-cell { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- 검색 필터 영역 -->
    <div class="card mb-4 p-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-2">
                <label class="form-label small fw-bold text-muted uppercase">업무그룹</label>
                <select class="form-select form-select-sm border-secondary-subtle">
                    <option value="">전체</option>
                    <option value="SY">시스템관리</option>
                    <option value="AT">근태관리</option>
                    <option value="ST">현황관리</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-bold text-muted uppercase">프로그램유형</label>
                <select class="form-select form-select-sm border-secondary-subtle">
                    <option value="">전체</option>
                    <option value="S">화면(Screen)</option>
                    <option value="A">API</option>
                </select>
            </div>
            <div class="col-md-5">
                <label class="form-label small fw-bold text-muted">프로그램 ID / 명</label>
                <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="검색어를 입력하세요.">
            </div>
            <div class="col-md-3 d-flex gap-2 justify-content-end">
                <button class="btn btn-sm btn-light border px-3"><i data-lucide="rotate-ccw" style="width:14px; margin-right:4px;"></i>초기화</button>
                <button class="btn btn-sm btn-gongcha px-4 shadow-sm"><i data-lucide="search" style="width:14px; margin-right:4px;"></i>조회</button>
            </div>
        </div>
    </div>

    <!-- 데이터 목록 영역 -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
            <div class="d-flex align-items-center gap-2">
                <i data-lucide="layout-grid" class="text-danger" style="color:var(--gongcha-red) !important; width:18px;"></i>
                <h6 class="mb-0 fw-bold">프로그램 리스트</h6>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary px-3"><i data-lucide="plus" style="width:14px; margin-right:4px;"></i>추가</button>
                <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" style="width:14px; margin-right:4px;"></i>저장</button>
            </div>
        </div>
        <div id="myGrid" class="ag-theme-alpine" style="height: 500px; width: 100%;"></div>
        <div class="card-footer bg-white border-top-0 p-3 text-center">
            <p class="mb-0 text-muted small">시스템의 모든 리소스를 정의하고 경로를 관리합니다.</p>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        lucide.createIcons();

        const columnDefs = [
            { field: "no", headerName: "NO", width: 60, pinned: 'left' },
            { field: "group", headerName: "업무그룹", width: 120 },
            { field: "id", headerName: "프로그램 ID", width: 150, cellStyle: { 'font-weight': 'bold', 'color': '#8B0029' } },
            { field: "name", headerName: "프로그램 명", width: 200 },
            { field: "type", headerName: "유형", width: 100, cellRenderer: params => {
                if (params.value === '화면') return '<span class="badge bg-light text-dark border">화면</span>';
                if (params.value === 'API') return '<span class="badge bg-light text-dark border text-primary">API</span>';
                return params.value;
            }},
            { field: "url", headerName: "경로 (URL)", flex: 1, minWidth: 200 },
            { field: "useYn", headerName: "사용", width: 80, cellRenderer: params => {
                return `<input type="checkbox" class="form-check-input" ${params.value ? 'checked' : ''} onclick="return false;">`;
            }},
            { field: "status", headerName: "상태", width: 100, cellRenderer: params => {
                if (params.value === '정상') return '<span class="status-badge bg-success-subtle text-success">정상</span>';
                if (params.value === '대기') return '<span class="status-badge bg-secondary-subtle text-secondary">대기</span>';
                return params.value;
            }}
        ];

        const rowData = [
            { no: 1, group: "시스템관리", id: "SY10010", name: "회사정보관리", type: "화면", url: "/company.html", useYn: true, status: "정상" },
            { no: 2, group: "근태관리", id: "AT10020", name: "정규직 근태관리", type: "화면", url: "/attendance_regular.html", useYn: true, status: "정상" },
            { no: 3, group: "근태관리", id: "AT10030", name: "파트타이머 근태관리", type: "화면", url: "/attendance_parttime.html", useYn: true, status: "정상" },
            { no: 4, group: "시스템관리", id: "SY10040", name: "사용자 API", type: "API", url: "/api/v1/users", useYn: true, status: "대기" }
        ];

        const gridOptions = {
            columnDefs: columnDefs,
            rowData: rowData,
            defaultColDef: {
                resizable: true,
                sortable: true,
                filter: true
            },
            pagination: true,
            paginationPageSize: 15
        };

        const gridDiv = document.querySelector('#myGrid');
        agGrid.createGrid(gridDiv, gridOptions);
    });
</script>
</body>
</html>
