<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공차 근태관리 - 프로그램정보</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Common CSS -->
    <link href="common.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- 검색 필터 영역 -->
    <div class="card mb-4">
        <div class="card-body p-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted uppercase">업무그룹</label>
                    <select class="form-select form-select-sm border-secondary-subtle">
                        <option value="">전체</option>
                        <option value="SY">시스템관리</option>
                        <option value="AT">근태관리</option>
                        <option value="ST">현황관리</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted uppercase">프로그램유형</label>
                    <select class="form-select form-select-sm border-secondary-subtle">
                        <option value="">전체</option>
                        <option value="S">화면(Screen)</option>
                        <option value="A">API</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label small fw-bold text-muted">프로그램 ID / 명</label>
                    <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="검색어를 입력하세요.">
                </div>
                <div class="col-md-3 d-flex gap-2 justify-content-end">
                    <button class="btn btn-sm btn-light border px-3"><i data-lucide="rotate-ccw" style="width:14px; margin-right:4px;"></i>초기화</button>
                    <button class="btn btn-sm btn-gongcha px-4"><i data-lucide="search" style="width:14px; margin-right:4px;"></i>조회</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 데이터 목록 영역 -->
    <div class="card">
        <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
            <div class="d-flex align-items-center gap-2">
                <i data-lucide="layout-grid" class="text-danger" style="color:var(--gongcha-red) !important; width:18px;"></i>
                <h6 class="mb-0 fw-bold">프로그램 리스트</h6>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary px-3"><i data-lucide="plus" style="width:14px; margin-right:4px;"></i>추가</button>
                <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" style="width:14px; margin-right:4px;"></i>저장</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="programTable">
                <thead>
                <tr>
                    <th class="text-center" style="width: 50px;">NO</th>
                    <th style="width: 120px;">업무그룹</th>
                    <th style="width: 150px;">프로그램 ID</th>
                    <th>프로그램 명</th>
                    <th style="width: 100px;" class="text-center">유형</th>
                    <th>경로 (URL)</th>
                    <th style="width: 80px;" class="text-center">사용</th>
                    <th style="width: 100px;" class="text-center">상태</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td class="text-center text-muted small">1</td>
                    <td class="small">시스템관리</td>
                    <td class="fw-bold small text-gongcha">SY10010</td>
                    <td class="small">회사정보관리</td>
                    <td class="text-center"><span class="badge bg-light text-dark border">화면</span></td>
                    <td class="small text-muted">/company.html</td>
                    <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                    <td class="text-center"><span class="status-badge bg-success-subtle text-success">정상</span></td>
                </tr>
                <tr>
                    <td class="text-center text-muted small">2</td>
                    <td class="small">근태관리</td>
                    <td class="fw-bold small text-gongcha">AT10020</td>
                    <td class="small">정규직 근태관리</td>
                    <td class="text-center"><span class="badge bg-light text-dark border">화면</span></td>
                    <td class="small text-muted">/attendance_regular.html</td>
                    <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                    <td class="text-center"><span class="status-badge bg-success-subtle text-success">정상</span></td>
                </tr>
                <tr>
                    <td class="text-center text-muted small">3</td>
                    <td class="small">근태관리</td>
                    <td class="fw-bold small text-gongcha">AT10030</td>
                    <td class="small">파트타이머 근태관리</td>
                    <td class="text-center"><span class="badge bg-light text-dark border">화면</span></td>
                    <td class="small text-muted">/attendance_parttime.html</td>
                    <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                    <td class="text-center"><span class="status-badge bg-success-subtle text-success">정상</span></td>
                </tr>
                <tr>
                    <td class="text-center text-muted small">4</td>
                    <td class="small">시스템관리</td>
                    <td class="fw-bold small text-gongcha">SY10040</td>
                    <td class="small">사용자 API</td>
                    <td class="text-center"><span class="badge bg-light text-dark border text-primary">API</span></td>
                    <td class="small text-muted">/api/v1/users</td>
                    <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                    <td class="text-center"><span class="status-badge bg-secondary-subtle text-secondary">대기</span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white border-top-0 p-3 text-center">
            <p class="mb-0 text-muted small">시스템의 모든 리소스를 정의하고 경로를 관리합니다.</p>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        // Lucide 아이콘 초기화
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        // 행 클릭 시 인터렉션 (샘플)
        $('#programTable tbody tr').on('click', function() {
            $('#programTable tbody tr').removeClass('table-active');
            $(this).addClass('table-active');
        });
    });
</script>
</body>
</html>
