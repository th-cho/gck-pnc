<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 공차 직영매장 근태관리 시스템</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Common CSS -->
    <link href="common.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-card {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 16px;
            background: white;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .signup-logo {
            width: 60px;
            margin-bottom: 1rem;
        }
        .form-control:focus {
            border-color: var(--gongcha-red);
            box-shadow: 0 0 0 0.25rem rgba(139, 0, 41, 0.25);
        }
        .btn-signup {
            background-color: var(--gongcha-red);
            color: white;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
        }
        .btn-signup:hover {
            background-color: var(--gongcha-dark);
            color: white;
        }
        .signup-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #6c757d;
        }
        .signup-footer a {
            color: var(--gongcha-red);
            text-decoration: none;
            font-weight: 500;
        }
        .signup-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="signup-header">
        <img src="simbol.png" alt="Gongcha" class="signup-logo">
        <h4 class="fw-bold mb-1">회원가입</h4>
        <p class="text-muted small">공차 직영매장 근태관리 시스템</p>
    </div>

    <form action="login.html">
        <div class="mb-3">
            <label for="userName" class="form-label small fw-bold text-secondary">이름</label>
            <input type="text" class="form-control" id="userName" placeholder="이름을 입력하세요" required>
        </div>
        <div class="mb-3">
            <label for="userId" class="form-label small fw-bold text-secondary">아이디</label>
            <input type="text" class="form-control" id="userId" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label small fw-bold text-secondary">비밀번호</label>
            <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label small fw-bold text-secondary">비밀번호 확인</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required>
        </div>
        <div class="mb-4">
            <label for="email" class="form-label small fw-bold text-secondary">이메일</label>
            <input type="email" class="form-control" id="email" placeholder="이메일을 입력하세요" required>
        </div>
        <button type="submit" class="btn btn-signup rounded-3">회원가입</button>
    </form>

    <div class="signup-footer">
        이미 계정이 있으신가요? <a href="login.html">로그인</a>
    </div>
</div>

</body>
</html>
