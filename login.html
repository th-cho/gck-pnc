<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 공차 직영매장 근태관리 시스템</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Common CSS -->
    <link href="common.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 16px;
            background: white;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            width: 60px;
            margin-bottom: 1rem;
        }
        .form-control:focus {
            border-color: var(--gongcha-red);
            box-shadow: 0 0 0 0.25rem rgba(139, 0, 41, 0.25);
        }
        .btn-login {
            background-color: var(--gongcha-red);
            color: white;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
        }
        .btn-login:hover {
            background-color: var(--gongcha-dark);
            color: white;
        }
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #6c757d;
        }
        .login-footer a {
            color: var(--gongcha-red);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <img src="simbol.png" alt="Gongcha" class="login-logo">
        <h4 class="fw-bold mb-1">로그인</h4>
        <p class="text-muted small">공차 직영매장 근태관리 시스템</p>
    </div>

    <form action="main.html">
        <div class="mb-3">
            <label for="userId" class="form-label small fw-bold text-secondary">아이디</label>
            <input type="text" class="form-control" id="userId" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label small fw-bold text-secondary">비밀번호</label>
            <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small text-secondary" for="rememberMe">
                    아이디 저장
                </label>
            </div>
            <a href="#" class="small text-secondary text-decoration-none">비밀번호 찾기</a>
        </div>
        <button type="submit" class="btn btn-login rounded-3">로그인</button>
    </form>

    <div class="login-footer">
        계정이 없으신가요? <a href="signup.html">회원가입</a>
    </div>
</div>

</body>
</html>
