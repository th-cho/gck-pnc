<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공통코드 관리 - 공차 직영매장 근태관리 시스템</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Common CSS -->
    <link href="common.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- AG Grid -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <style>
        body { padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04); }

        /* AG Grid 커스텀 스타일 */
        .ag-theme-alpine {
            --ag-header-height: 40px;
            --ag-row-height: 40px;
            --ag-font-size: 12px;
            --ag-header-background-color: #f8f9fa;
            --ag-odd-row-background-color: #ffffff;
            --ag-border-color: #dee2e6;
        }
        .ag-header-cell-label { justify-content: center; }
        .ag-cell { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="card mb-4 p-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-8">
                <label class="form-label small fw-bold text-muted">코드구분명 검색</label>
                <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="코드구분명 또는 코드를 입력하세요">
            </div>
            <div class="col-md-4 d-flex gap-2 justify-content-end">
                <button class="btn btn-sm btn-light border px-4"><i data-lucide="rotate-ccw" class="me-1" style="width:14px;"></i>초기화</button>
                <button class="btn btn-sm btn-gongcha px-4 shadow-sm"><i data-lucide="search" class="me-1" style="width:14px;"></i>조회</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white p-3 border-bottom-0">
                    <div class="d-flex align-items-center gap-2">
                        <i data-lucide="folder" class="text-danger" style="color:var(--gongcha-red) !important;"></i>
                        <h6 class="mb-0 fw-bold">코드구분 목록</h6>
                    </div>
                </div>
                <div id="gridMaster" class="ag-theme-alpine" style="height: 500px; width: 100%;"></div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white p-3 border-bottom-0 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <i data-lucide="list" class="text-danger" style="color:var(--gongcha-red) !important;"></i>
                        <h6 class="mb-0 fw-bold">상세코드 목록</h6>
                    </div>
                    <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" class="me-1" style="width:14px;"></i>저장</button>
                </div>
                <div id="gridDetail" class="ag-theme-alpine" style="height: 500px; width: 100%;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        lucide.createIcons();

        // 마스터 그리드 (코드구분)
        const masterColumnDefs = [
            { field: "groupCode", headerName: "구분코드", width: 100, pinned: 'left', cellStyle: { 'font-weight': 'bold' } },
            { field: "groupName", headerName: "구분명", flex: 1 }
        ];

        const masterRowData = [
            { groupCode: "SY001", groupName: "직급구분" },
            { groupCode: "SY002", groupName: "근태유형" },
            { groupCode: "SY003", groupName: "휴가구분" },
            { groupCode: "SY004", groupName: "매장지역" },
            { groupCode: "SY005", groupName: "공휴일구분" }
        ];

        const masterGridOptions = {
            columnDefs: masterColumnDefs,
            rowData: masterRowData,
            defaultColDef: {
                resizable: true,
                sortable: true,
                filter: true
            },
            rowSelection: 'single',
            onRowSelected: onMasterRowSelected
        };

        const gridMasterDiv = document.querySelector('#gridMaster');
        agGrid.createGrid(gridMasterDiv, masterGridOptions);

        // 디테일 그리드 (상세코드)
        const detailColumnDefs = [
            { field: "code", headerName: "코드", width: 100, editable: true, cellStyle: { 'font-weight': 'bold' } },
            { field: "name", headerName: "코드명", flex: 1, editable: true },
            { field: "useYn", headerName: "사용여부", width: 100, editable: true, cellRenderer: params => {
                return `<input type="checkbox" ${params.value ? 'checked' : ''} onclick="return false;">`;
            }}
        ];

        const detailRowData = [
            { code: "10", name: "점포관리자", useYn: true },
            { code: "20", name: "매니저", useYn: true },
            { code: "30", name: "캡틴", useYn: true },
            { code: "40", name: "크루", useYn: true }
        ];

        const detailGridOptions = {
            columnDefs: detailColumnDefs,
            rowData: detailRowData, // 초기 데이터
            defaultColDef: {
                resizable: true,
                sortable: true,
                filter: true
            }
        };

        const gridDetailDiv = document.querySelector('#gridDetail');
        const detailGridApi = agGrid.createGrid(gridDetailDiv, detailGridOptions);

        function onMasterRowSelected(event) {
            if (event.node.isSelected()) {
                // 실제로는 여기서 서버 통신 등을 통해 상세 데이터를 가져와야 함
                // 예시로 데이터 변경 시뮬레이션
                const selectedData = event.data;
                console.log("Selected Group:", selectedData.groupName);
                // detailGridApi.setGridOption('rowData', newData); // v31+ 방식
            }
        }
    });
</script>
</body>
</html>
