<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; padding: 20px; }
        :root { --gongcha-red: #8B0029; }
        .btn-gongcha { background-color: var(--gongcha-red); color: white; border: none; }
        .card { border: none; border-radius: 12px; }
        .info-label { font-size: 11px; font-weight: 700; color: #6c757d; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row g-4">
        <div class="col-xl-7">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="fw-bold mb-0 text-gongcha">회사 기본 정보</h6>
                    <button class="btn btn-sm btn-gongcha px-3">저장</button>
                </div>
                <div class="row g-3">
                    <div class="col-md-6"><span class="info-label">회사코드</span><input type="text" class="form-control form-control-sm bg-light" value="GCK" readonly></div>
                    <div class="col-md-6"><span class="info-label">회사명</span><input type="text" class="form-control form-control-sm" value="공차코리아"></div>
                    <div class="col-12"><span class="info-label">사업자번호</span><input type="text" class="form-control form-control-sm" value="214-88-84534"></div>
                    <div class="col-12"><span class="info-label">주소</span><input type="text" class="form-control form-control-sm" value="서울 종로구 종로33길 15, 8층"></div>
                </div>
            </div>
        </div>
        <div class="col-xl-5">
            <div class="card p-4">
                <h6 class="fw-bold mb-3">환경 설정 정보</h6>
                <table class="table table-sm small">
                    <thead><tr class="table-light"><th>코드명</th><th>내용</th></tr></thead>
                    <tbody>
                    <tr><td>대표URL</td><td>https://gong-cha.co.kr/</td></tr>
                    <tr><td>정산일</td><td>매월 25일</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
