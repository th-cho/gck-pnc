<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회사 정보 관리 - 공차 직영매장 근태관리 시스템</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Common CSS -->
    <link href="common.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- AG Grid -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <style>
        body { padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04); }
        .info-label { font-size: 11px; font-weight: 700; color: #6c757d; margin-bottom: 5px; display: block; }

        /* AG Grid 커스텀 스타일 */
        .ag-theme-alpine {
            --ag-header-height: 40px;
            --ag-row-height: 40px;
            --ag-font-size: 12px;
            --ag-header-background-color: #f8f9fa;
            --ag-odd-row-background-color: #ffffff;
            --ag-border-color: #dee2e6;
        }
        .ag-header-cell-label { justify-content: center; }
        .ag-cell { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row g-4">
        <div class="col-xl-7">
            <div class="card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="d-flex align-items-center gap-2">
                        <i data-lucide="building-2" class="text-danger" style="color:var(--gongcha-red) !important;"></i>
                        <h6 class="fw-bold mb-0 text-gongcha">회사 기본 정보</h6>
                    </div>
                    <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" class="me-1" style="width:14px;"></i>저장</button>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <span class="info-label">회사코드</span>
                        <input type="text" class="form-control form-control-sm bg-light" value="GCK" readonly>
                    </div>
                    <div class="col-md-6">
                        <span class="info-label">회사명</span>
                        <input type="text" class="form-control form-control-sm" value="공차코리아">
                    </div>
                    <div class="col-md-6">
                        <span class="info-label">대표자명</span>
                        <input type="text" class="form-control form-control-sm" value="고희경">
                    </div>
                    <div class="col-md-6">
                        <span class="info-label">사업자번호</span>
                        <input type="text" class="form-control form-control-sm" value="214-88-84534">
                    </div>
                    <div class="col-12">
                        <span class="info-label">주소</span>
                        <input type="text" class="form-control form-control-sm" value="서울 종로구 종로33길 15, 8층">
                    </div>
                    <div class="col-md-6">
                        <span class="info-label">전화번호</span>
                        <input type="text" class="form-control form-control-sm" value="02-3276-5800">
                    </div>
                    <div class="col-md-6">
                        <span class="info-label">팩스번호</span>
                        <input type="text" class="form-control form-control-sm" value="02-3276-5801">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-5">
            <div class="card p-0 h-100 border-0 shadow-sm">
                <div class="card-header bg-white p-3 border-bottom-0">
                    <div class="d-flex align-items-center gap-2">
                        <i data-lucide="settings" class="text-danger" style="color:var(--gongcha-red) !important;"></i>
                        <h6 class="mb-0 fw-bold">환경 설정 정보</h6>
                    </div>
                </div>
                <div id="myGrid" class="ag-theme-alpine" style="height: 300px; width: 100%;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        lucide.createIcons();

        const columnDefs = [
            { field: "codeName", headerName: "설정 항목", width: 150, pinned: 'left', cellStyle: { 'font-weight': 'bold' } },
            { field: "value", headerName: "설정값", flex: 1, editable: true }
        ];

        const rowData = [
            { codeName: "대표 URL", value: "https://gong-cha.co.kr/" },
            { codeName: "급여 정산일", value: "매월 25일" },
            { codeName: "근태 마감일", value: "매월 5일" },
            { codeName: "관리자 이메일", value: "admin@gong-cha.co.kr" },
            { codeName: "시스템 버전", value: "v1.0.2" }
        ];

        const gridOptions = {
            columnDefs: columnDefs,
            rowData: rowData,
            defaultColDef: {
                resizable: true,
                sortable: false,
                filter: false
            }
        };

        const gridDiv = document.querySelector('#myGrid');
        agGrid.createGrid(gridDiv, gridOptions);
    });
</script>
</body>
</html>
