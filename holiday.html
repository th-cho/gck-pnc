<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공휴일 관리 - 공차 직영매장 근태관리 시스템</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Common CSS -->
    <link href="common.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- AG Grid -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <style>
        body { padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04); }

        /* AG Grid 커스텀 스타일 */
        .ag-theme-alpine {
            --ag-header-height: 40px;
            --ag-row-height: 40px;
            --ag-font-size: 12px;
            --ag-header-background-color: #f8f9fa;
            --ag-odd-row-background-color: #ffffff;
            --ag-border-color: #dee2e6;
        }
        .ag-header-cell-label { justify-content: center; }
        .ag-cell { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="card mb-4 p-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-2">
                <label class="form-label small fw-bold text-muted">연도 선택</label>
                <select class="form-select form-select-sm border-secondary-subtle">
                    <option>2026년</option>
                    <option>2025년</option>
                </select>
            </div>
            <div class="col-md-10 d-flex justify-content-end gap-2">
                <button class="btn btn-sm btn-light border px-4"><i data-lucide="rotate-ccw" class="me-1" style="width:14px;"></i>초기화</button>
                <button class="btn btn-sm btn-gongcha px-4 shadow-sm"><i data-lucide="search" class="me-1" style="width:14px;"></i>조회</button>
                <button class="btn btn-sm btn-gongcha px-4 shadow-sm"><i data-lucide="save" class="me-1" style="width:14px;"></i>저장</button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white p-3 border-bottom-0">
            <div class="d-flex align-items-center gap-2">
                <i data-lucide="calendar-days" class="text-danger" style="color:var(--gongcha-red) !important;"></i>
                <h6 class="mb-0 fw-bold">공휴일 설정</h6>
            </div>
        </div>
        <div id="myGrid" class="ag-theme-alpine" style="height: 500px; width: 100%;"></div>
    </div>
</div>

<script>
    $(document).ready(function() {
        lucide.createIcons();

        const columnDefs = [
            { field: "date", headerName: "일자", width: 150, editable: true, cellEditor: 'agDateCellEditor' },
            { field: "day", headerName: "요일", width: 100, valueGetter: params => {
                if (!params.data.date) return '';
                const date = new Date(params.data.date);
                const days = ['일', '월', '화', '수', '목', '금', '토'];
                return days[date.getDay()];
            }, cellStyle: params => {
                if (params.value === '일') return { color: '#dc3545', fontWeight: 'bold' };
                if (params.value === '토') return { color: '#0d6efd', fontWeight: 'bold' };
                return null;
            }},
            { field: "name", headerName: "휴일명", width: 200, editable: true },
            { field: "type", headerName: "구분", width: 150, editable: true, cellEditor: 'agSelectCellEditor', cellEditorParams: { values: ['법정공휴일', '대체공휴일', '임시공휴일', '회사창립일'] } },
            { field: "note", headerName: "비고", flex: 1, editable: true }
        ];

        const rowData = [
            { date: "2026-01-01", name: "신정", type: "법정공휴일", note: "" },
            { date: "2026-02-17", name: "설날", type: "법정공휴일", note: "" },
            { date: "2026-02-18", name: "설날", type: "법정공휴일", note: "" },
            { date: "2026-02-19", name: "설날", type: "법정공휴일", note: "" },
            { date: "2026-03-01", name: "삼일절", type: "법정공휴일", note: "" },
            { date: "2026-05-05", name: "어린이날", type: "법정공휴일", note: "" },
            { date: "2026-05-24", name: "부처님오신날", type: "법정공휴일", note: "" },
            { date: "2026-05-25", name: "대체공휴일", type: "대체공휴일", note: "부처님오신날 대체" }
        ];

        const gridOptions = {
            columnDefs: columnDefs,
            rowData: rowData,
            defaultColDef: {
                resizable: true,
                sortable: true,
                filter: true
            },
            pagination: true,
            paginationPageSize: 15
        };

        const gridDiv = document.querySelector('#myGrid');
        agGrid.createGrid(gridDiv, gridOptions);
    });
</script>
</body>
</html>
