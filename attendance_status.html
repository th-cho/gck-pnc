<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공차 근태관리 - 현황 조회</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Common CSS -->
  <link href="common.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- AG Grid -->
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <style>
    body {
      padding: 20px;
    }

    .card {
      margin-bottom: 1.5rem;
    }

    .stat-card {
      border-left: 4px solid var(--gongcha-red);
    }

    /* AG Grid 커스텀 스타일 */
    .ag-theme-alpine {
      --ag-header-height: 40px;
      --ag-row-height: 40px;
      --ag-font-size: 12px;
      --ag-header-background-color: #f8f9fa;
      --ag-odd-row-background-color: #ffffff;
      --ag-border-color: #dee2e6;
    }

    .ag-header-cell-label {
      justify-content: center;
    }

    .ag-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <!-- 상단 필터 영역 -->
  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label small fw-bold text-muted uppercase">조회년월</label>
          <input type="month" class="form-control form-control-sm border-secondary-subtle" value="2026-02">
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted uppercase">매장명</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option value="all">전체 매장</option>
            <option value="광복점" selected>광복점</option>
            <option value="강남본점">강남본점</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold text-muted">성명 / 사번</label>
          <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="검색어를 입력하세요.">
        </div>
        <div class="col-md-3 d-flex gap-2 justify-content-end">
          <button class="btn btn-sm btn-light border px-3"><i data-lucide="rotate-ccw" style="width:14px; margin-right:4px;"></i>초기화</button>
          <button class="btn btn-sm btn-gongcha px-4"><i data-lucide="search" style="width:14px; margin-right:4px;"></i>조회</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 요약 통계 카드 -->
  <div class="row mb-2">
    <div class="col-md-3">
      <div class="card stat-card p-3">
        <div class="text-muted small fw-bold mb-1">총 인원</div>
        <div class="h4 fw-bold mb-0">12명</div>
        <div class="text-success small mt-2"><i data-lucide="trending-up" style="width:12px;"></i> 전월 대비 +1</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card p-3">
        <div class="text-muted small fw-bold mb-1">평균 근로시간</div>
        <div class="h4 fw-bold mb-0">158.4h</div>
        <div class="text-muted small mt-2">월 기준시간 대비 99%</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card p-3">
        <div class="text-muted small fw-bold mb-1">연장근무 발생</div>
        <div class="h4 fw-bold mb-0 text-danger">42.5h</div>
        <div class="text-danger small mt-2">전월 대비 12% 증가</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card p-3">
        <div class="text-muted small fw-bold mb-1">근태 정합성 미달</div>
        <div class="h4 fw-bold mb-0 text-warning">2건</div>
        <div class="text-muted small mt-2">수정 및 확정 필요</div>
      </div>
    </div>
  </div>

  <!-- 상세 현황 테이블 -->
  <div class="card shadow-sm border-0 mt-4">
    <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
      <div class="d-flex align-items-center gap-2">
        <i data-lucide="bar-chart-3" class="text-danger" style="color:var(--gongcha-red) !important; width:18px;"></i>
        <h6 class="mb-0 fw-bold">월간 근태 현황 상세</h6>
      </div>
      <button class="btn btn-sm btn-outline-secondary px-3"><i data-lucide="download" style="width:14px; margin-right:4px;"></i>엑셀 다운로드</button>
    </div>
    <div id="myGrid" class="ag-theme-alpine" style="height: 400px; width: 100%;"></div>
    <div class="card-footer bg-white border-top-0 p-3">
      <p class="mb-0 text-muted small text-center"><i data-lucide="info" style="width:12px; margin-right:4px;"></i>모든 근태 데이터는 실시간 전산 입력값을 기준으로 집계됩니다.</p>
    </div>
  </div>
</div>

<script>
  $(document).ready(function() {
    lucide.createIcons();

    const columnDefs = [
      { field: "id", headerName: "사번", width: 100, pinned: 'left', cellStyle: { 'font-weight': 'bold', 'color': '#8B0029' } },
      { field: "name", headerName: "성명", width: 100, pinned: 'left' },
      { field: "type", headerName: "구분", width: 100 },
      { field: "regularWork", headerName: "정근(h)", width: 100 },
      { field: "overtimeWork", headerName: "연장(h)", width: 100 },
      { field: "nightWork", headerName: "심야(h)", width: 100 },
      { field: "holidayWork", headerName: "휴일(h)", width: 100 },
      { field: "totalWork", headerName: "누적 총계", width: 120, cellStyle: { 'font-weight': 'bold' } },
      { field: "complianceRate", headerName: "주 52h 준수율", width: 200, cellRenderer: params => {
          const rate = params.value;
          let colorClass = 'bg-success';
          let textClass = 'text-muted';

          if (rate > 100) {
              colorClass = 'bg-danger';
              textClass = 'text-danger fw-bold';
          } else if (rate > 90) {
              colorClass = 'bg-warning';
          }

          return `
            <div class="d-flex align-items-center gap-2" style="height: 100%;">
              <div class="progress flex-grow-1" style="height: 8px; border-radius: 4px;">
                <div class="progress-bar ${colorClass}" role="progressbar" style="width: ${Math.min(rate, 100)}%"></div>
              </div>
              <span class="small ${textClass}">${rate}%</span>
            </div>
          `;
      }},
      { field: "status", headerName: "상태", width: 100, cellRenderer: params => {
          if (params.value === '정상') return '<span class="badge bg-success-subtle text-success">정상</span>';
          if (params.value === '주의') return '<span class="badge bg-danger-subtle text-danger">주의</span>';
          return params.value;
      }}
    ];

    const rowData = [
      { id: "S19080901", name: "박지홍", type: "정규직", regularWork: 160.0, overtimeWork: 12.5, nightWork: 2.0, holidayWork: 0.0, totalWork: "174.5h", complianceRate: 92, status: "정상" },
      { id: "P24082201", name: "김예지", type: "단시간", regularWork: 120.0, overtimeWork: 5.0, nightWork: 1.5, holidayWork: 8.0, totalWork: "134.5h", complianceRate: 65, status: "정상" },
      { id: "S23112702", name: "이연장", type: "정규직", regularWork: 160.0, overtimeWork: 22.0, nightWork: 4.0, holidayWork: 16.0, totalWork: "202.0h", complianceRate: 105, status: "주의" }
    ];

    const gridOptions = {
      columnDefs: columnDefs,
      rowData: rowData,
      defaultColDef: {
        resizable: true,
        sortable: true,
        filter: true
      }
    };

    const gridDiv = document.querySelector('#myGrid');
    agGrid.createGrid(gridDiv, gridOptions);
  });
</script>
</body>
</html>
