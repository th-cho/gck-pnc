<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공차 근태관리 - 근무설정(파트타이머)</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Common CSS -->
  <link href="common.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- AG Grid -->
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <style>
    body {
      padding: 20px;
    }

    .card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04); }

    .badge-parttimer {
      background-color: #e7f3ff;
      color: #0056b3;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* AG Grid 커스텀 스타일 */
    .ag-theme-alpine {
      --ag-header-height: 40px;
      --ag-row-height: 40px;
      --ag-font-size: 12px;
      --ag-header-background-color: #f8f9fa;
      --ag-odd-row-background-color: #ffffff;
      --ag-border-color: #dee2e6;
    }

    .ag-header-cell-label {
      justify-content: center;
    }

    .ag-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <!-- 필터 영역 -->
  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label small fw-bold text-muted">유형</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option value="">전체</option>
            <option value="SHORT">단시간(15h↑)</option>
            <option value="ULTRA">초단시간(15h↓)</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">매장명</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option value="광복점">광복점</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold text-muted">성명</label>
          <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="성명 검색">
        </div>
        <div class="col-md-3 d-flex gap-2 justify-content-end">
          <button class="btn btn-sm btn-gongcha px-4"><i data-lucide="search" style="width:14px; margin-right:4px;"></i>조회</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 설정 그리드 -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
      <div class="d-flex align-items-center gap-2">
        <i data-lucide="user-plus" class="text-danger" style="color:var(--gongcha-red) !important; width:18px;"></i>
        <h6 class="mb-0 fw-bold">파트타이머 주간 근무 요일 및 시간 설정</h6>
      </div>
      <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" style="width:14px; margin-right:4px;"></i>저장</button>
    </div>
    <div id="myGrid" class="ag-theme-alpine" style="height: 400px; width: 100%;"></div>
  </div>
</div>

<script>
  $(document).ready(function() {
    lucide.createIcons();

    const columnDefs = [
      { field: "no", headerName: "NO", width: 60, pinned: 'left' },
      { field: "type", headerName: "구분", width: 100, cellRenderer: params => {
          if (params.value === '단시간') return '<span class="badge-parttimer">단시간</span>';
          if (params.value === '초단시간') return '<span class="badge bg-light text-dark border">초단시간</span>';
          return params.value;
      }},
      { field: "id", headerName: "사번", width: 100, cellStyle: { 'font-weight': 'bold', 'color': '#8B0029' } },
      { field: "name", headerName: "성명", width: 100 },
      { field: "workDays", headerName: "근무요일", width: 150, editable: true },
      { field: "startTime", headerName: "출근", width: 100, editable: true },
      { field: "endTime", headerName: "퇴근", width: 100, editable: true },
      { field: "breakTime", headerName: "휴게(h)", width: 80, editable: true },
      { field: "dailyWorkTime", headerName: "일근무(h)", width: 100, cellStyle: { 'font-weight': 'bold' } },
      { field: "weeklyWorkTime", headerName: "주합계(h)", width: 100, cellStyle: params => {
          return params.value >= 15 ? { 'color': '#0d6efd', 'font-weight': 'bold' } : { 'color': '#6c757d' };
      }},
      { field: "holidayAllowance", headerName: "주휴수당", width: 100, cellStyle: params => {
          return params.value === '발생(대상)' ? { 'color': '#198754', 'font-weight': 'bold' } : { 'color': '#6c757d' };
      }}
    ];

    const rowData = [
      { no: 1, type: "단시간", id: "P24082201", name: "김하늘", workDays: "월,화,수,목,금", startTime: "17:00", endTime: "22:30", breakTime: "0.5", dailyWorkTime: "5.0", weeklyWorkTime: 25.0, holidayAllowance: "발생(대상)" },
      { no: 2, type: "초단시간", id: "P25012503", name: "이초단", workDays: "토,일", startTime: "10:00", endTime: "14:00", breakTime: "0.0", dailyWorkTime: "4.0", weeklyWorkTime: 8.0, holidayAllowance: "미발생" }
    ];

    const gridOptions = {
      columnDefs: columnDefs,
      rowData: rowData,
      defaultColDef: {
        resizable: true,
        sortable: true,
        filter: true
      }
    };

    const gridDiv = document.querySelector('#myGrid');
    agGrid.createGrid(gridDiv, gridOptions);
  });
</script>
</body>
</html>
