<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공차 근태관리 - 근무설정(파트타이머)</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Common CSS -->
  <link href="common.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      padding: 20px;
    }

    .card { border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04); }
    .table thead th { border-top: none; }

    .badge-parttimer {
      background-color: #e7f3ff;
      color: #0056b3;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <!-- 필터 영역 -->
  <div class="card mb-4">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label small fw-bold text-muted">유형</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option value="">전체</option>
            <option value="SHORT">단시간(15h↑)</option>
            <option value="ULTRA">초단시간(15h↓)</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">매장명</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option value="광복점">광복점</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold text-muted">성명</label>
          <input type="text" class="form-control form-control-sm border-secondary-subtle" placeholder="성명 검색">
        </div>
        <div class="col-md-3 d-flex gap-2 justify-content-end">
          <button class="btn btn-sm btn-gongcha px-4"><i data-lucide="search" style="width:14px; margin-right:4px;"></i>조회</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 설정 그리드 -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
      <div class="d-flex align-items-center gap-2">
        <i data-lucide="user-plus" class="text-danger" style="color:var(--gongcha-red) !important; width:18px;"></i>
        <h6 class="mb-0 fw-bold">파트타이머 주간 근무 요일 및 시간 설정</h6>
      </div>
      <button class="btn btn-sm btn-gongcha px-3 shadow-sm"><i data-lucide="save" style="width:14px; margin-right:4px;"></i>저장</button>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 text-center" style="min-width: 1000px;">
        <thead>
        <tr>
          <th style="width: 50px;">NO</th>
          <th>구분</th>
          <th>사번</th>
          <th>성명</th>
          <th>근무요일</th>
          <th style="width: 100px;">출근</th>
          <th style="width: 100px;">퇴근</th>
          <th style="width: 80px;">휴게(h)</th>
          <th style="width: 80px;">일근무(h)</th>
          <th style="width: 100px;">주합계(h)</th>
          <th>주휴수당</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td class="text-muted small">1</td>
          <td><span class="badge badge-parttimer">단시간</span></td>
          <td class="fw-bold text-gongcha">P24082201</td>
          <td>김하늘</td>
          <td><input type="text" class="form-control form-control-sm mx-auto" value="월,화,수,목,금" style="width: 150px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="17:00" style="width: 70px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="22:30" style="width: 70px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="0.5" style="width: 50px;"></td>
          <td class="fw-bold">5.0</td>
          <td class="text-primary fw-bold">25.0</td>
          <td class="small text-success fw-bold">발생(대상)</td>
        </tr>
        <tr>
          <td class="text-muted small">2</td>
          <td><span class="badge bg-light text-dark border">초단시간</span></td>
          <td class="fw-bold text-gongcha">P25012503</td>
          <td>이초단</td>
          <td><input type="text" class="form-control form-control-sm mx-auto" value="토,일" style="width: 150px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="10:00" style="width: 70px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="14:00" style="width: 70px;"></td>
          <td><input type="text" class="form-control form-control-sm text-center mx-auto" value="0.0" style="width: 50px;"></td>
          <td class="fw-bold">4.0</td>
          <td class="text-muted">8.0</td>
          <td class="small text-muted">미발생</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  $(document).ready(function() {
    if (typeof lucide !== 'undefined') lucide.createIcons();
  });
</script>
</body>
</html>
