<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공차 근태관리 - 파트타이머</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Common CSS -->
  <link href="common.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- AG Grid -->
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <style>
    body {
      padding: 20px;
    }

    .card {
      margin-bottom: 1.5rem;
    }

    /* 파트타이머 전용 스타일 */
    .badge-15h {
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
      font-weight: bold;
    }
    .text-primary-custom { color: #0d6efd; font-weight: bold; }
    .sat { color: #0d6efd; }
    .sun { color: #dc3545; }
    .highlight-row { background-color: #f8faff; }

    /* AG Grid 커스텀 스타일 */
    .ag-theme-alpine {
      --ag-header-height: 40px;
      --ag-row-height: 40px;
      --ag-font-size: 12px;
      --ag-header-background-color: #f8f9fa;
      --ag-odd-row-background-color: #ffffff;
      --ag-border-color: #dee2e6;
    }

    .ag-header-cell-label {
      justify-content: center;
    }

    .ag-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 주말 색상 */
    .sat-col { color: #0d6efd; font-weight: bold; }
    .sun-col { color: #dc3545; font-weight: bold; }

    /* 합계 컬럼 강조 */
    .total-col { background-color: #fdf5f7 !important; font-weight: bold; color: var(--gongcha-red); }
  </style>
</head>
<body>
<div class="container-fluid">

  <!-- 1. 파트타이머 정책 알림 -->
  <div class="alert alert-info border-0 shadow-sm p-3 mb-4 d-flex align-items-center gap-2 small" style="background-color: #eef2ff; color: #4338ca; border-radius: 10px;">
    <i data-lucide="info" style="width:16px;"></i>
    <div>
      <strong>파트타이머 관리 정책:</strong> 1주 소정근로 15시간 이상(단시간) 근로자는 주휴수당 및 공휴일 유급수당 발생 대상입니다. 15시간 미만(초단시간)은 제외됩니다.
    </div>
  </div>

  <!-- 2. 조회 필터 -->
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label small fw-bold text-muted uppercase">근태년월</label>
          <input type="month" class="form-control form-control-sm border-secondary-subtle" value="2026-02">
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted uppercase">매장명</label>
          <select class="form-select form-select-sm border-secondary-subtle">
            <option>광복점</option>
            <option>강남본점</option>
          </select>
        </div>
        <div class="col-md-7 d-flex justify-content-end gap-2">
          <button class="btn btn-sm btn-light border px-4"><i data-lucide="rotate-ccw" class="me-1" style="width:14px;"></i>초기화</button>
          <button class="btn btn-sm btn-gongcha px-4 shadow-sm"><i data-lucide="search" class="me-1" style="width:14px;"></i>조회</button>
          <button class="btn btn-sm btn-gongcha px-4 shadow-sm"><i data-lucide="save" class="me-1" style="width:14px;"></i>저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 근태 매트릭스 그리드 (AG Grid) -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white p-3 border-bottom-0 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <i data-lucide="users" class="text-danger" style="color:var(--gongcha-red) !important;"></i>
        <h6 class="mb-0 fw-bold">파트타이머 일별 근태 입력 현황</h6>
      </div>
      <div class="badge badge-15h px-3 py-2 shadow-sm">
        <i data-lucide="check-circle" class="me-1" style="width:12px;"></i> 주휴수당 자동판정 프로세스 가동중
      </div>
    </div>
    <div id="myGrid" class="ag-theme-alpine" style="height: 400px; width: 100%;"></div>
  </div>

  <!-- 4. 하단 안내문 -->
  <div class="mt-2 px-2">
    <p class="text-muted" style="font-size: 11px;">
      <i data-lucide="help-circle" class="me-1" style="width:12px; vertical-align: middle;"></i>
      실근무 시간은 [퇴근 - 출근 - 휴게시간]으로 자동 계산되며, 근로기준법에 따라 4시간 근무 시 30분 무급 휴게가 자동 차감될 수 있습니다.
    </p>
  </div>
</div>

<script>
  $(document).ready(function() {
    lucide.createIcons();

    // AG Grid 설정
    const columnDefs = [
      { field: "name", headerName: "성명", width: 80, pinned: 'left', cellStyle: { 'font-weight': 'bold' } },
      { field: "type", headerName: "구분", width: 80, pinned: 'left', cellRenderer: params => {
          if (params.value === '단시간') return '<span class="badge badge-15h">단시간</span>';
          if (params.value === '초단시간') return '<span class="badge bg-secondary-subtle text-secondary border">초단시간</span>';
          return params.value;
      }},
      { field: "item", headerName: "항목", width: 80, pinned: 'left', cellStyle: { 'background-color': '#f8f9fa' } },
      // 날짜 컬럼 생성 (2월 1일 ~ 2월 28일 예시)
      ...Array.from({ length: 28 }, (_, i) => {
        const day = i + 1;
        const date = new Date(2026, 1, day); // 2026년 2월
        const dayOfWeek = date.getDay(); // 0:일, 6:토
        let headerClass = '';

        if (dayOfWeek === 0) headerClass = 'sun-col';
        else if (dayOfWeek === 6) headerClass = 'sat-col';

        return {
          field: `d${day}`,
          headerName: `${day}일`,
          width: 60,
          editable: true,
          headerClass: headerClass,
          cellStyle: params => {
             if (dayOfWeek === 0) return { color: '#dc3545' };
             if (dayOfWeek === 6) return { color: '#0d6efd' };
             return null;
          }
        };
      }),
      { field: "total", headerName: "주간 합계", width: 90, pinned: 'right', cellClass: 'total-col' }
    ];

    const rowData = [
      { name: "김하늘", type: "단시간", item: "출근", d1: "17:00", d2: "17:00", d3: "-", d4: "17:00", d5: "17:00", d6: "17:00", total: "-" },
      { name: "김하늘", type: "단시간", item: "퇴근", d1: "22:30", d2: "22:00", d3: "-", d4: "22:00", d5: "22:00", d6: "22:00", total: "-" },
      { name: "김하늘", type: "단시간", item: "실근무", d1: "5.0", d2: "4.5", d3: "0", d4: "4.5", d5: "4.5", d6: "4.5", total: "23.0h ↑" },

      { name: "이초단", type: "초단시간", item: "출근", d1: "-", d2: "10:00", d3: "-", d4: "-", d5: "10:00", d6: "-", total: "-" },
      { name: "이초단", type: "초단시간", item: "퇴근", d1: "-", d2: "14:00", d3: "-", d4: "-", d5: "14:00", d6: "-", total: "-" },
      { name: "이초단", type: "초단시간", item: "실근무", d1: "0", d2: "4.0", d3: "0", d4: "0", d5: "4.0", d6: "0", total: "8.0h" },
    ];

    const gridOptions = {
      columnDefs: columnDefs,
      rowData: rowData,
      defaultColDef: {
        resizable: true,
        sortable: false,
        filter: false
      },
      getRowStyle: params => {
        if (params.data.item === '실근무') {
           // 실근무 행 강조
           return { fontWeight: 'bold' };
        }
      }
    };

    const gridDiv = document.querySelector('#myGrid');
    agGrid.createGrid(gridDiv, gridOptions);
  });
</script>
</body>
</html>
